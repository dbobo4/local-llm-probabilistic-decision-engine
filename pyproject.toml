[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-decision-engine"
version = "0.1.0"
description = "Structured probabilistic decision inference for local causal language models using direct candidate scoring."
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "llm",
    "local-ai",
    "inference",
    "decision-engine",
    "candidate-scoring",
    "probabilistic-ai",
    "transformers",
    "classification",
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "torch>=2.14.0",
    "transformers>=5.17.0,<6",
    "accelerate>=1.15.0,<2",
    "safetensors>=0.8.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "build>=1.6,<2",
    "twine>=6,<7",
]

[project.urls]
Repository = "https://github.com/dbobo4/local-llm-probabilistic-decision-engine"
Issues = "https://github.com/dbobo4/local-llm-probabilistic-decision-engine/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
